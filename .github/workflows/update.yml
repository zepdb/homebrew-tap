name: Update formula

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Update from the latest published SDK
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/update_formula.py
      - name: Check formula syntax
        run: |
          if [ -f Formula/zeppelin-embed.rb ]; then
            ruby -c Formula/zeppelin-embed.rb
          fi
      - name: Commit an updated formula
        run: |
          git add Formula/zeppelin-embed.rb 2>/dev/null || true
          if git diff --cached --quiet; then
            exit 0
          fi
          version=$(ruby -ne 'puts $1 if /^  version "([^"]+)"/' Formula/zeppelin-embed.rb)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Zeppelin Embed to $version"
          git push
