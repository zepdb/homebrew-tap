name: Test formula

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
      - name: Validate tap
        run: |
          if [ ! -f Formula/zeppelin-embed.rb ]; then
            echo "No published formula yet."
            exit 0
          fi
          ruby -c Formula/zeppelin-embed.rb
          brew tap zepdb/tap "$GITHUB_WORKSPACE"
          brew style --formula zepdb/tap/zeppelin-embed
          brew trust --formula zepdb/tap/zeppelin-embed
          brew install zepdb/tap/zeppelin-embed
          brew test zepdb/tap/zeppelin-embed
